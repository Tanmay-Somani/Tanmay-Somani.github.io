<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Tanmay Somani</title>
    <!-- Apply saved theme BEFORE first paint (matches index.html behaviour) -->
    <script>
    (function () {
        try {
            var t = ['light', 'dark', 'funky'];
            var i = parseInt(localStorage.getItem('ts-theme'), 10);
            if (!(i >= 0 && i < t.length)) {
                i = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 1 : 0;
            }
            document.documentElement.dataset.theme = t[i];
        } catch (e) {}
    })();
    </script>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Page not found. Head back to Tanmay Somani's portfolio.">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="assets/images/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <link rel="preload" href="assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <style>
        :root {
            color-scheme: light;
            --bg-primary:    #f7f8fc;
            --bg-secondary:  #eef0f7;
            --bg-card:       #ffffff;
            --bg-nav:        rgba(247,248,252,0.92);
            --text-primary:  #0b0f1a;
            --text-secondary:#3a4160;
            --text-muted:    #565e85;
            --text-on-accent:#ffffff;
            --accent:        #0d9488;
            --accent-hover:  #0f766e;
            --accent-soft:   #ccfbf1;
            --accent-glow:   rgba(13,148,136,0.18);
            --border:        rgba(11,15,26,0.08);
            --border-strong: rgba(11,15,26,0.18);
            --shadow-sm: 0 1px 2px rgba(11,15,26,0.06);
            --shadow-md: 0 4px 12px rgba(11,15,26,0.09);
            --shadow-lg: 0 12px 36px rgba(11,15,26,0.12);
            --tag-bg:    rgba(13,148,136,0.10);
            --tag-text:  #0f766e;
            --grid-line: rgba(13,148,136,0.07);
            --radius: 0px;
            --scanline: rgba(255,41,84,0);
        }
        [data-theme="dark"] {
            color-scheme: dark;
            --bg-primary:    #0a0f1e;
            --bg-secondary:  #0f1628;
            --bg-card:       #141c30;
            --bg-nav:        rgba(10,15,30,0.88);
            --text-primary:  #e8f0fe;
            --text-secondary:#94a3c4;
            --text-muted:    #7183ab;
            --text-on-accent:#0a0f1e;
            --accent:        #22d3ee;
            --accent-hover:  #06b6d4;
            --accent-soft:   rgba(34,211,238,0.10);
            --accent-glow:   rgba(34,211,238,0.22);
            --border:        rgba(34,211,238,0.10);
            --border-strong: rgba(34,211,238,0.22);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.40);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.55);
            --shadow-lg: 0 16px 56px rgba(0,0,0,0.65);
            --tag-bg:    rgba(34,211,238,0.12);
            --tag-text:  #22d3ee;
            --grid-line: rgba(34,211,238,0.05);
            --radius: 0px;
            --scanline:   rgba(255,41,84,0);
        }
        [data-theme="funky"] {
            color-scheme: dark;
            --bg-primary:    #060512;
            --bg-secondary:  #0a0818;
            --bg-card:       #0d0a1f;
            --bg-nav:        rgba(6,5,18,0.96);
            --text-primary:  #ff2954;
            --text-secondary:#ff6b8a;
            --text-muted:    #cf5973;
            --text-on-accent:#060512;
            --accent:        #ff2954;
            --accent-hover:  #ff5c7a;
            --accent-soft:   rgba(255,41,84,0.10);
            --accent-glow:   rgba(255,41,84,0.30);
            --border:        rgba(255,41,84,0.25);
            --border-strong: rgba(255,41,84,0.50);
            --shadow-sm: 0 0 6px rgba(255,41,84,0.20);
            --shadow-md: 0 0 18px rgba(255,41,84,0.28);
            --shadow-lg: 0 0 42px rgba(255,41,84,0.38);
            --tag-bg:    rgba(255,41,84,0.12);
            --tag-text:  #ff2954;
            --grid-line: rgba(255,41,84,0.08);
            --radius: 0px;
            --crt-red: #ff2954;
            --crt-blue: #2ee6ff;
            --scanline:   rgba(255,41,84,.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: clamp(1rem, 4vw, 3rem);
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* CRT scanlines - only visible in funky mode via the token */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(0deg, var(--scanline) 0 1px, transparent 1px 3px);
        }

        .nf-stage { max-width: 640px; }

        .nf-kicker {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(0.72rem, 2.2vw, 0.85rem);
            letter-spacing: 0.32em;
            color: var(--accent);
            margin-bottom: 0.75rem;
        }
        [data-theme="funky"] .nf-kicker {
            color: var(--crt-red);
            text-shadow: 0 0 8px rgba(255,41,84,0.55);
        }

        .nf-code {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: clamp(6.5rem, 22vw, 11rem);
            line-height: 1;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }
        .nf-code .zero { color: var(--accent); }
        [data-theme="dark"] .nf-code {
            text-shadow: 0 0 32px var(--accent-glow);
        }
        [data-theme="funky"] .nf-code {
            color: var(--crt-red);
            text-shadow: 0 0 20px var(--crt-red), 0 0 60px rgba(255,41,84,0.35);
        }
        [data-theme="funky"] .nf-code .zero { color: var(--crt-blue); text-shadow: 0 0 16px var(--crt-blue); }

        .nf-message {
            color: var(--text-secondary);
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
            max-width: 46ch;
            margin: 0 auto 2rem;
        }

        .nf-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }

        .btn-solid {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--accent);
            color: var(--text-on-accent);
            padding: 0.7rem 1.6rem;
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
            text-decoration: none;
            font-family: inherit;
        }
        .btn-solid:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }
        .btn-line {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            color: var(--text-primary);
            padding: 0.7rem 1.6rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background 0.18s, border-color 0.18s, transform 0.18s;
            text-decoration: none;
            font-family: inherit;
        }
        .btn-line:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }
        [data-theme="funky"] .btn-solid,
        [data-theme="funky"] .btn-line {
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="nf-stage">
        <p class="nf-kicker">&gt; ERR_PAGE_NOT_FOUND_</p>
        <h1 class="nf-code">4<span class="zero">0</span>4</h1>
        <p class="nf-message">This page slipped out of the codex. The link may be broken,
            or the page was moved somewhere else entirely.</p>
        <div class="nf-actions">
            <a href="index.html" class="btn-solid">
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Home
            </a>
            <a href="sitemap.html" class="btn-line">
                <i class="fas fa-sitemap" aria-hidden="true"></i> View sitemap
            </a>
        </div>
    </main>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () { });
        });
    }
</script>
</body>
</html>
